<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARNAM Trunks</title>
    <style>
        /* ============================================================
           GLOBAL RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                              url('sharnam.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        header {
            background-color: #003366;
            color: white;
            padding: 15px;
            text-align: center;
            margin: 10px;
            border-radius: 15px;
        }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        main {
            display: flex;
            flex: 1;
            margin: 0 10px 10px 10px;
            gap: 10px;
        }

        .trunks-available {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(3px);
            border-radius: 10px;
            padding: 20px;
        }

        .add-trunks {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        /* ============================================================
           FIELDSET / LEGEND / RADIO GROUP
           ============================================================ */
        fieldset {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: rgba(255, 255, 255, 0.03);
        }

        legend {
            padding: 0 10px;
            font-weight: bold;
            color: #00e5ff;
            font-size: 0.9rem;
        }

        fieldset label {
            display: inline-flex;
            align-items: center;
            margin-right: 15px;
            cursor: pointer;
            font-weight: normal;
        }

        fieldset input[type="radio"] {
            margin-right: 6px;
            transform: scale(1.1);
        }

        /* ============================================================
           FORM ELEMENTS
           ============================================================ */
        .form p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        select {
            font-weight: bold;
            cursor: pointer;
        }

        input[type="text"]:focus,
        select:focus {
            border: 2px solid #00e5ff;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #00e5ff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>SHARNAM-NetTool: Trunks </h1>
    </header>

    <main>
        <section class="trunks-available">
            <h2>Available trunks</h2>
            <ul id="channels" class="channels">
                <!-- JavaScript will insert interface rows here dynamically -->
            </ul>
        </section>

        <aside class="add-trunks">
            <h2>Add trunks to interfaces and port-channels</h2>

            <form class="form" id="add-trunk-form">
                <p>
                    <label for="site-id">Site ID</label>
                    <input type="text" id="site-id" name="site-id"
                           placeholder="e.g., site_0001" required>
                </p>

                <p>
                    <label for="device-role">Device Role</label>
                    <input type="text" id="device-role" name="device-role"
                           placeholder="e.g., core, distribution, access">
                </p>

                <p>
                    <label for="platform">Device Platform</label>
                    <input type="text" id="platform" name="platform"
                           placeholder="e.g., CISCO-IOS-XE">
                </p>

                <p>
                    <label for="hostname">Hostname</label>
                    <input type="text" id="hostname" name="hostname"
                           placeholder="e.g., NRB-RT-001">
                </p>
				
                <p>
                    <label for="native">native vlan</label>
                    <input type="number" id="native" name="native"
                           placeholder="e.g., (vlan id) 1 or 10" required>
                </p>				
				
				

                <!-- Interface Type (radio group) -->
                <p>trunks encryption is dot1q</p>
				
                <fieldset>
                    <legend>Multi-Interface Trunks Orchestration</legend>

                    <div id="interfaces">
                        <!-- Dynamic VLAN rows will be injected here -->
                    </div>

                    <button type="button" id="add-interface-btn"
                            style="margin-top: 10px; background: #27ae60; color: white;">
                        + Add interface
                    </button>
                </fieldset>
				
                <fieldset>
                    <legend>Port-Channel Orchestration</legend>

                    <div id="port-channel">
                        
                    </div>

                    <button type="button" id="add-portchannel-btn"
                            style="margin-top: 10px; background: #27ae60; color: white;">
                        + Add port-channel
                    </button>
                </fieldset>				

                <fieldset>
                    <legend>VLANS ALLOWED</legend>

                    <div id="vlan-rows">
                        <!-- Dynamic VLAN rows will be injected here -->
                    </div>

                    <button type="button" id="add-vlan-btn"
                            style="margin-top: 10px; background: #27ae60; color: white;">
                        + Add VLAN
                    </button>
                </fieldset>			

                <button type="submit">Create Trunk (s) </button>
            </form>
        </aside>
    </main>
