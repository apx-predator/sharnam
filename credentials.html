<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARNAM Credentials</title>
    <style>
        /* ============================================================
           GLOBAL RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                              url('sharnam.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        header {
            background-color: #003366;
            color: white;
            padding: 15px;
            text-align: center;
            margin: 10px;
            border-radius: 15px;
        }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        main {
            display: flex;
            flex: 1;
            margin: 0 10px 10px 10px;
            gap: 10px;
        }

        .credentials-available {
            flex: 3;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(3px);
            border-radius: 10px;
            padding: 20px;
        }

        .add-credentials {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        /* ============================================================
           FORM ELEMENTS
           ============================================================ */
        .form p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border: 2px solid #00e5ff;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #00e5ff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>SHARNAM-NetTool: Credentials Profiles</h1>
    </header>

    <main>
        <section class="credentials-available">
            <h2>Saved Profiles</h2>
            <ul id="credentials" class="credentials">
                <!-- JavaScript will insert profile rows here dynamically -->
            </ul>
        </section>

        <aside class="add-credentials">
            <h2>Create Profile</h2>
            <form class="form" id="add-credentials-form">
                <p>
                    <label for="profile-name">Profile Name</label>
                    <input type="text" id="profile-name" name="profile-name"
                           placeholder="e.g., Cisco_Core_Auth" required>
                </p>

                <p>
                    <label for="username">SSH/API Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="e.g., admin" required>
                </p>

                <p>
                    <label for="password">Password / Key Secret</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••••••" required>
                </p>

                <button type="submit">Save Profile</button>
            </form>
        </aside>
    </main>

    <script>
        /* ============================================================
           ADD CREDENTIAL PROFILE TO DATABASE
           ============================================================ */
        const addForm = document.getElementById("add-credentials-form");

        addForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Read input values
            const profName = document.getElementById("profile-name").value.trim();
            const user     = document.getElementById("username").value.trim();
            const pass     = document.getElementById("password").value.trim();

            // Basic client-side validation
            if (!profName || !user || !pass) {
                alert("Please fill in all fields before submitting.");
                return;
            }

            const profile = {
                prof_name: profName,
                username: user,
                password: pass
            };

            try {
                const response = await fetch("api1.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(profile)
                });

                if (!response.ok) {
                    throw new Error("Network error while trying to contact backend!!!👾👾");
                }

                const resp = await response.json();

                if (resp.status === "error") {
                    throw new Error(resp.message);
                }

                alert("Profile created successfully! ✔✔🎉");
                addForm.reset();
                loadProfiles();

            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        /* ============================================================
           LOAD PROFILES FROM BACKEND
           ============================================================ */
        const profilesList = document.getElementById("credentials");

        async function loadProfiles() {
            try {
                const response = await fetch("api1.php");

                if (!response.ok) {
                    throw new Error("Error while trying to contact backend!!!");
                }

                const data = await response.json();

                if (data.status === "error") {
                    throw new Error(data.message);
                }

                profilesList.innerHTML = "";

                data.profiles.forEach(function (profile) {
                    try {
                        const li = document.createElement("li");
                        li.className = "profiles-list";
                        li.style.listStyle = "none";
                        li.style.marginBottom = "15px";
                        li.style.padding = "10px";
                        li.style.backgroundColor = "rgba(255,255,255,0.05)";
                        li.style.borderRadius = "5px";

                        li.innerHTML = `
                            <div style="margin-bottom: 8px;">
                                <strong>profile_id:</strong>
                                <span class="profile-id">${profile.profile_id}</span><br>

                                <strong>profile_name:</strong>
                                <span class="profile-name">${profile.profile_name}</span><br>

                                <strong>username:</strong>
                                <span class="txt-type">${profile.username}</span><br>
                            </div>

                            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                                <button class="btn-delete"
                                        style="background: #e74c3c; color: white; padding: 4px 10px;
                                               font-size: 12px; width: auto; margin: 0; border: none;
                                               border-radius: 3px; cursor: pointer;">
                                    Remove
                                </button>
                            </div>
                        `;

                        profilesList.appendChild(li);

                        /* Hook up delete listener for this specific profile */
                        const delBtn = li.querySelector(".btn-delete");

                        delBtn.addEventListener("click", async function () {
                            if (!confirm(`Are you sure you want to remove profile ${profile.username}?`)) {
                                return;
                            }

                            try {
                                const deleting = await fetch("api1.php", {
                                    method: "DELETE",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({ id: profile.profile_id })
                                });

                                if (!deleting.ok) {
                                    throw new Error("Error while trying to delete the profile!!!");
                                }

                                const delRes = await deleting.json();

                                if (delRes.status === "error") {
                                    throw new Error(delRes.message);
                                }

                                alert("Profile deleted successfully! ✔✔🎉");
                                loadProfiles();

                            } catch (err) {
                                alert("Deletion error: " + err.message);
                            }
                        });

                    } catch (renderErr) {
                        console.error("Error rendering profile:", renderErr.message);
                    }
                });

            } catch (err) {
                console.error("loadProfiles error:", err.message);
            }
        }

        /* ============================================================
           INITIAL LOAD + AUTO-SYNC LOOP
           ============================================================ */
        loadProfiles();
        setInterval(loadProfiles, 10000);
    </script>
</body>
</html>
